<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    background:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1200') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
}

/* Overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,80,40,.65);
    z-index:-1;
}

/* Container */
.wrapper{
    width:100%;
    max-width:450px;
}

/* Logo Area */
.logo-box{
    background:#fff;
    padding:15px;
    border-radius:8px;
    text-align:center;
    margin-bottom:20px;
}

.logo-box img{
    width:220px;
    max-width:100%;
}

/* Form Card */
.form-card{
    background:#fff;
    padding:25px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.form-card h2{
    font-size:36px;
    margin-bottom:20px;
    color:#333;
}

.form-group{
    margin-bottom:12px;
}

.form-control{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    outline:none;
    font-size:15px;
}

.form-control:focus{
    border-color:#0b7a44;
}

.btn{
    background:#0b7a44;
    color:#fff;
    border:none;
    padding:12px 25px;
    cursor:pointer;
    font-weight:bold;
    border-radius:2px;
}

.btn:hover{
    background:#086438;
}

/* Toast Alert */
.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#d9534f;
    color:#fff;
    padding:14px 25px;
    border-radius:5px;
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:999;
}

.toast.show{
    opacity:1;
    visibility:visible;
}

/* Desktop */
@media(min-width:768px){

.wrapper{
    max-width:550px;
}

.form-card{
    padding:35px;
}

.form-card h2{
    font-size:42px;
}
}
</style>
</head>
<body>

<div class="wrapper">

    <!-- SECCAP Logo -->
    <div class="logo-box">
        <img src="https://seccap.dgcs.gos.pk/assets/img/logo.png" alt="SECCAP Logo">
    </div>

    <!-- Form -->
    <div class="form-card">
        <h2>Check your Attendance</h2>

        <form id="attendanceForm">

            <div class="form-group">
                <select class="form-control" id="student">
                    <option value="">Olevel Student</option>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" id="cnic" class="form-control" placeholder="CNIC / B-FORM No">
            </div>

            <div class="form-group">
                <input type="text" id="roll" class="form-control" placeholder="Enter Your Matric Roll No">
            </div>

            <button type="submit" class="btn">CHECK</button>

        </form>
    </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">
    Please fill all required fields!
</div>

<script>

const form = document.getElementById("attendanceForm");
const toast = document.getElementById("toast");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const student = document.getElementById("student").value.trim();
    const cnic = document.getElementById("cnic").value.trim();
    const roll = document.getElementById("roll").value.trim();

    if(student === "" || cnic === "" || roll === ""){
        showToast("Please fill all required fields!");
        return;
    }

    showToast("Form submitted successfully!");
});

function showToast(message){

    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);
}
</script>

</body>
</html>
